<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StaticPengu — Upload a Website</title>
  <style>
    /* Cartoony, thick lines, bold colors, playful pengu vibes */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #ffe9c7;
      background-image: radial-gradient(circle at 20% 30%, #fff4e6 0%, #ffe1b4 80%);
      font-family: 'Fredoka', 'Quicksand', 'Segoe UI', system-ui, sans-serif;
      font-weight: 500;
      color: #1e1a2b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ---- MAIN FULL-WIDTH WRAPPER ---- */
    .main-wrap {
      display: flex;
      width: 100%;
      max-width: 1400px;
      min-height: calc(100vh - 48px); /* fill viewport height minus padding */
      gap: 32px;
      align-items: stretch;
    }

    /* ---- LEFT SIDE: FORM ---- */
    .form-side {
      flex: 1 1 55%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #fffaee;
      border: 6px solid #1e1a2b;
      border-radius: 48px;
      box-shadow: 12px 12px 0 #1e1a2b, 0 10px 20px rgba(0, 0, 0, 0.15);
      padding: 40px 36px;
      overflow-y: auto;
    }

    /* brand */
    .brand {
      display: inline-block;
      margin-bottom: 22px;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -2px;
      color: #1e1a2b;
      background: #ffd966;
      padding: 6px 28px 8px 22px;
      border: 5px solid #1e1a2b;
      border-radius: 100px;
      box-shadow: 5px 5px 0 #1e1a2b;
      transform: rotate(-1.5deg);
      line-height: 1.1;
      align-self: flex-start;
    }

    .brand span {
      color: #ff5e5e;
      text-shadow: 2px 2px 0 #1e1a2b;
      -webkit-text-stroke: 1px #1e1a2b;
    }

    .brand::before {
      content: "🐧";
      font-size: 36px;
      margin-right: 12px;
      display: inline-block;
      vertical-align: middle;
      transform: scaleX(-1);
    }

    h1 {
      font-size: clamp(36px, 7vw, 58px);
      line-height: 1.05;
      letter-spacing: -3px;
      font-weight: 900;
      color: #1e1a2b;
      margin-bottom: 10px;
      text-shadow: 4px 4px 0 #ffb347;
      -webkit-text-stroke: 1.5px #1e1a2b;
    }

    .subtitle {
      font-size: 18px;
      font-weight: 600;
      color: #3d3552;
      margin-bottom: 32px;
      background: #e0d7ff;
      display: inline-block;
      padding: 8px 22px;
      border-radius: 40px;
      border: 3px solid #1e1a2b;
      box-shadow: 3px 3px 0 #1e1a2b;
      letter-spacing: -0.3px;
      align-self: flex-start;
    }

    /* DROPZONE */
    .dropzone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      padding: 28px 18px;
      border: 6px dashed #1e1a2b;
      border-radius: 32px;
      background: #ffedc9;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: inset 0 0 0 4px #fff2d7, 0 6px 0 #b09b82;
    }

    .dropzone:hover,
    .dropzone.dragging {
      background: #ffe0a8;
      border-color: #ff5e5e;
      box-shadow: inset 0 0 0 4px #fff6e6, 0 6px 0 #1e1a2b;
      transform: scale(1.01);
    }

    .upload-icon {
      font-size: 68px;
      line-height: 1;
      margin-bottom: 12px;
      filter: drop-shadow(4px 6px 0 #1e1a2b);
      transform: rotate(2deg);
    }

    .dropzone strong {
      font-size: 22px;
      font-weight: 900;
      color: #1e1a2b;
      letter-spacing: -0.5px;
      background: #fff0b5;
      padding: 4px 18px;
      border-radius: 40px;
      border: 3px solid #1e1a2b;
      display: inline-block;
      box-shadow: 3px 3px 0 #1e1a2b;
      margin-bottom: 8px;
    }

    .dropzone span {
      color: #3d3552;
      font-size: 15px;
      font-weight: 600;
      background: #fef7e9;
      padding: 4px 14px;
      border-radius: 30px;
      border: 2px solid #1e1a2b;
      box-shadow: 2px 2px 0 #1e1a2b;
      margin-top: 4px;
    }

    .dropzone span:last-child {
      background: #f3e7fe;
      font-size: 13px;
    }

    .file-input {
      display: none;
    }

    /* file info */
    .file-info {
      display: none;
      margin-top: 22px;
      padding: 18px 16px;
      background: #d6f0ff;
      border: 5px solid #1e1a2b;
      border-radius: 28px;
      box-shadow: 6px 6px 0 #1e1a2b;
    }

    .file-info.visible {
      display: block;
    }

    .file-name {
      font-size: 18px;
      font-weight: 900;
      color: #1e1a2b;
      overflow-wrap: anywhere;
      background: #fff1b8;
      display: inline-block;
      padding: 4px 14px;
      border-radius: 30px;
      border: 3px solid #1e1a2b;
      margin-bottom: 6px;
    }

    .file-size {
      font-size: 15px;
      font-weight: 700;
      color: #2e2a3a;
      background: #e7d9ff;
      padding: 3px 14px;
      border-radius: 30px;
      display: inline-block;
      border: 2px solid #1e1a2b;
      margin-bottom: 12px;
    }

    .progress-track {
      height: 24px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 40px;
      background: #beb3d6;
      border: 4px solid #1e1a2b;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: 40px;
      background: linear-gradient(90deg, #ffb347, #ff8c42);
      border-right: 4px solid #1e1a2b;
      transition: width 0.2s ease;
      box-shadow: inset 0 -4px 0 #e07c1f;
    }

    .progress-text {
      display: block;
      margin-top: 10px;
      color: #1e1a2b;
      font-size: 15px;
      font-weight: 700;
      background: #fff4d6;
      padding: 4px 12px;
      border-radius: 40px;
      border: 2px solid #1e1a2b;
      text-align: center;
    }

    /* BUTTON */
    .button {
      width: 100%;
      margin-top: 26px;
      padding: 18px 18px;
      border: 5px solid #1e1a2b;
      border-radius: 60px;
      background: linear-gradient(145deg, #7fd1ff, #5aa9e6);
      color: #1e1a2b;
      font: inherit;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      cursor: pointer;
      box-shadow: 0 8px 0 #1e1a2b, 0 12px 18px rgba(0, 0, 0, 0.2);
      transition: all 0.08s linear;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 11px 0 #1e1a2b, 0 15px 20px rgba(0, 0, 0, 0.2);
      background: #85d6ff;
    }

    .button:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #1e1a2b, 0 8px 12px rgba(0, 0, 0, 0.15);
    }

    .button:disabled {
      opacity: 0.5;
      transform: translateY(4px);
      box-shadow: 0 4px 0 #1e1a2b, 0 6px 10px rgba(0, 0, 0, 0.1);
      cursor: not-allowed;
      background: #c0c0d0;
      filter: grayscale(0.6);
    }

    /* status */
    .status {
      display: none;
      margin-top: 22px;
      padding: 18px 20px;
      border-radius: 28px;
      border: 5px solid #1e1a2b;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
      overflow-wrap: anywhere;
      box-shadow: 6px 6px 0 #1e1a2b;
    }

    .status.visible {
      display: block;
    }

    .status.error {
      background: #ffc9c9;
      color: #9e1e1e;
    }

    .status.success {
      background: #b8f0c5;
      color: #0b5523;
    }

    .status a {
      display: inline-block;
      margin-top: 12px;
      color: #1e1a2b;
      font-weight: 900;
      background: #ffdb7c;
      padding: 6px 18px;
      border-radius: 40px;
      border: 3px solid #1e1a2b;
      text-decoration: none;
      box-shadow: 3px 3px 0 #1e1a2b;
      transition: 0.1s;
    }

    .status a:hover {
      background: #ffc107;
      transform: translateY(-2px);
      box-shadow: 5px 5px 0 #1e1a2b;
    }

    .note {
      margin-top: 28px;
      color: #3d3552;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      background: #f8e4b0;
      padding: 8px 12px;
      border-radius: 60px;
      border: 3px solid #1e1a2b;
      display: inline-block;
      align-self: center;
      box-shadow: 3px 3px 0 #1e1a2b;
    }

    /* ---- RIGHT SIDE: HUGE PENGUIN ---- */
    .pengu-side {
      flex: 0 0 40%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #b8e2ff;
      background-image: radial-gradient(circle at 30% 40%, #d4efff, #8ecae6);
      border: 6px solid #1e1a2b;
      border-radius: 48px;
      box-shadow: 12px 12px 0 #1e1a2b, 0 10px 20px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    .pengu-side svg {
      width: 90%;
      height: 90%;
      max-width: 480px;
      filter: drop-shadow(10px 12px 0 #1e1a2b);
      transform: scale(1);
      transition: transform 0.3s ease;
    }

    .pengu-side svg:hover {
      transform: scale(1.02) rotate(1deg);
    }

    /* Responsive: stack on smaller screens */
    @media (max-width: 900px) {
      body {
        padding: 16px;
        align-items: flex-start;
      }
      .main-wrap {
        flex-direction: column;
        min-height: auto;
        gap: 24px;
      }
      .form-side {
        flex: 1 1 auto;
        padding: 28px 22px;
        border-radius: 36px;
      }
      .pengu-side {
        flex: 0 0 auto;
        min-height: 280px;
        border-radius: 36px;
      }
      .pengu-side svg {
        max-width: 280px;
      }
      .brand {
        font-size: 32px;
      }
      h1 {
        font-size: 36px;
      }
    }

    @media (max-width: 500px) {
      .form-side {
        padding: 20px 16px;
      }
      .brand {
        font-size: 26px;
      }
      h1 {
        font-size: 28px;
      }
      .dropzone {
        min-height: 170px;
        padding: 20px 12px;
      }
      .upload-icon {
        font-size: 48px;
      }
    }
  </style>
</head>
<body>
  <div class="main-wrap">
    <!-- LEFT: form -->
    <section class="form-side">
      <div class="brand">static<span>pengu</span></div>
      <h1>Deploy your website.</h1>
      <p class="subtitle">🐧 Upload a ZIP — we'll handle the rest.</p>

      <form id="uploadForm">
        <label class="dropzone" id="dropzone" for="zipFile">
          <div class="upload-icon">📦</div>
          <strong>Drop your ZIP file here</strong>
          <span>or click to browse your files</span>
          <span style="margin-top: 12px">ZIP archives only · Max 50 MB</span>
        </label>

        <input class="file-input" id="zipFile" name="file" type="file"
          accept=".zip,application/zip,application/x-zip-compressed" required />

        <div class="file-info" id="fileInfo">
          <div class="file-name" id="fileName"></div>
          <div class="file-size" id="fileSize"></div>
          <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
          <span class="progress-text" id="progressText">Ready to upload</span>
        </div>

        <button class="button" id="uploadButton" type="submit" disabled>Upload website</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </form>
      <p class="note">🐧 Static website hosting · HTML, CSS and JavaScript</p>
    </section>

    <!-- RIGHT: massive penguin -->
    <aside class="pengu-side">
      <svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" aria-label="Giant cartoon penguin">
        <!-- BODY -->
        <ellipse cx="200" cy="320" rx="150" ry="170" fill="#2b2b3a" stroke="#1e1a2b" stroke-width="10" />
        <!-- BELLY -->
        <ellipse cx="200" cy="350" rx="100" ry="120" fill="#fef7e9" stroke="#1e1a2b" stroke-width="10" />
        <!-- HEAD -->
        <circle cx="200" cy="140" r="100" fill="#2b2b3a" stroke="#1e1a2b" stroke-width="10" />
        <!-- FACE PATCH -->
        <ellipse cx="200" cy="155" rx="70" ry="60" fill="#fef7e9" stroke="#1e1a2b" stroke-width="10" />
        <!-- EYES -->
        <circle cx="165" cy="130" r="20" fill="#ffffff" stroke="#1e1a2b" stroke-width="8" />
        <circle cx="235" cy="130" r="20" fill="#ffffff" stroke="#1e1a2b" stroke-width="8" />
        <circle cx="172" cy="134" r="9" fill="#1e1a2b" />
        <circle cx="242" cy="134" r="9" fill="#1e1a2b" />
        <circle cx="175" cy="130" r="3" fill="#ffffff" />
        <circle cx="245" cy="130" r="3" fill="#ffffff" />
        <!-- BEAK -->
        <path d="M185 165 L200 195 L215 165 Z" fill="#ffb347" stroke="#1e1a2b" stroke-width="8" stroke-linejoin="round" />
        <!-- CHEEKS -->
        <circle cx="140" cy="175" r="14" fill="#ffb3b3" opacity="0.8" />
        <circle cx="260" cy="175" r="14" fill="#ffb3b3" opacity="0.8" />
        <!-- WINGS / FLIPPERS -->
        <path d="M70 250 Q30 310 60 400" fill="#2b2b3a" stroke="#1e1a2b" stroke-width="10" stroke-linecap="round" />
        <path d="M330 250 Q370 310 340 400" fill="#2b2b3a" stroke="#1e1a2b" stroke-width="10" stroke-linecap="round" />
        <!-- FEET -->
        <ellipse cx="140" cy="475" rx="50" ry="25" fill="#ffb347" stroke="#1e1a2b" stroke-width="10" />
        <ellipse cx="260" cy="475" rx="50" ry="25" fill="#ffb347" stroke="#1e1a2b" stroke-width="10" />
        <path d="M110 475 L110 490 M170 475 L170 490" stroke="#1e1a2b" stroke-width="6" stroke-linecap="round" />
        <path d="M230 475 L230 490 M290 475 L290 490" stroke="#1e1a2b" stroke-width="6" stroke-linecap="round" />
        <!-- HAT (tiny cute beanie) -->
        <path d="M130 70 Q200 10 270 70" fill="#ff5e5e" stroke="#1e1a2b" stroke-width="10" stroke-linecap="round" />
        <circle cx="200" cy="30" r="18" fill="#fef7e9" stroke="#1e1a2b" stroke-width="8" />
        <!-- SCARF -->
        <path d="M120 230 Q200 260 280 230" fill="none" stroke="#ff5e5e" stroke-width="18" stroke-linecap="round" />
        <path d="M280 230 L300 280" stroke="#ff5e5e" stroke-width="18" stroke-linecap="round" />
      </svg>
    </aside>
  </div>

  <script>
    const form = document.getElementById("uploadForm");
    const fileInput = document.getElementById("zipFile");
    const dropzone = document.getElementById("dropzone");
    const fileInfo = document.getElementById("fileInfo");
    const fileName = document.getElementById("fileName");
    const fileSize = document.getElementById("fileSize");
    const uploadButton = document.getElementById("uploadButton");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const statusBox = document.getElementById("status");

    const MAX_FILE_SIZE = 50 * 1024 * 1024;
    let selectedFile = null;
    let uploading = false;

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function showStatus(message, type) {
      statusBox.replaceChildren();
      statusBox.className = `status visible ${type}`;
      const text = document.createElement("div");
      text.textContent = message;
      statusBox.appendChild(text);
    }

    function selectFile(file) {
      if (!file || uploading) return;
      statusBox.className = "status";
      statusBox.replaceChildren();

      if (!file.name.toLowerCase().endsWith(".zip")) {
        selectedFile = null;
        fileInput.value = "";
        fileInfo.classList.remove("visible");
        uploadButton.disabled = true;
        showStatus("Please select a ZIP archive.", "error");
        return;
      }

      if (file.size === 0 || file.size > MAX_FILE_SIZE) {
        selectedFile = null;
        fileInput.value = "";
        fileInfo.classList.remove("visible");
        uploadButton.disabled = true;
        showStatus(file.size === 0 ? "The selected file is empty." :
          "The ZIP file exceeds the 50 MB upload limit.", "error");
        return;
      }

      selectedFile = file;
      fileName.textContent = file.name;
      fileSize.textContent = formatBytes(file.size);
      progressBar.style.width = "0%";
      progressText.textContent = "Ready to upload";
      fileInfo.classList.add("visible");
      uploadButton.disabled = false;
      uploadButton.textContent = "Upload website";
    }

    fileInput.addEventListener("change", () => selectFile(fileInput.files[0]));

    ["dragenter", "dragover"].forEach((eventName) => {
      dropzone.addEventListener(eventName, (event) => {
        event.preventDefault();
        if (!uploading) dropzone.classList.add("dragging");
      });
    });

    ["dragleave", "drop"].forEach((eventName) => {
      dropzone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropzone.classList.remove("dragging");
      });
    });

    dropzone.addEventListener("drop", (event) => {
      selectFile(event.dataTransfer.files[0]);
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!selectedFile || uploading) return;

      uploading = true;
      uploadButton.disabled = true;
      uploadButton.textContent = "Uploading...";
      statusBox.className = "status";

      const data = new FormData();
      data.append("file", selectedFile);

      const xhr = new XMLHttpRequest();
      xhr.open("POST", "https://mc-lxcrvq0y7t.b-cdn.net/api/sites");

      xhr.upload.addEventListener("progress", (event) => {
        if (!event.lengthComputable) return;
        const percent = Math.round((event.loaded / event.total) * 100);
        progressBar.style.width = `${percent}%`;
        progressText.textContent = `Uploading: ${percent}%`;
      });

      xhr.addEventListener("load", () => {
        uploading = false;
        uploadButton.disabled = !selectedFile;
        uploadButton.textContent = "Upload website";

        let result;
        try {
          result = JSON.parse(xhr.responseText);
        } catch {
          showStatus("The server returned an invalid response.", "error");
          progressText.textContent = "Upload failed";
          return;
        }

        if (xhr.status < 200 || xhr.status >= 300) {
          showStatus(result.error || result.message || "Upload failed.", "error");
          progressText.textContent = "Upload failed";
          return;
        }

        if (!result.id || !result.url) {
          showStatus("The server response is missing the website ID or URL.", "error");
          return;
        }

        progressBar.style.width = "100%";
        progressText.textContent = "Website deployed";
        statusBox.className = "status visible success";
        statusBox.replaceChildren();

        const heading = document.createElement("strong");
        heading.textContent = "Website uploaded successfully!";
        const link = document.createElement("a");
        link.href = result.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Open your website →";
        const id = document.createElement("div");
        id.style.marginTop = "8px";
        id.textContent = `Website ID: ${result.id}`;
        statusBox.append(heading, document.createElement("br"), link, id);
      });

      xhr.addEventListener("error", () => {
        uploading = false;
        uploadButton.disabled = !selectedFile;
        uploadButton.textContent = "Upload website";
        progressText.textContent = "Upload failed";
        showStatus("Could not connect to the server. Check that the backend is running.", "error");
      });

      xhr.send(data);
    });
  </script>
</body>
</html>
